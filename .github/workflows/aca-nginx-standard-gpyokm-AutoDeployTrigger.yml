name: Trigger auto deployment for aca-nginx-standard-gpyokm

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/aca-nginx-standard-gpyokm-AutoDeployTrigger.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACANGINXSTANDARDGPYOKM_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACANGINXSTANDARDGPYOKM_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ACANGINXSTANDARDGPYOKM_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy container
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.DOCKERHUB_USERNAME }}
          registryPassword: ${{ secrets.DOCKERHUB_TOKEN }}
          containerAppName: aca-nginx-standard-gpyokm
          resourceGroup: rg-aca-lab-GPYOKM
          imageToBuild: ${{ secrets.DOCKERHUB_USERNAME }}/aca-nginx-standard:${{ github.sha }}
